<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="A living field of fifty colorful particles. Slow down and watch them find their way.">
  <title>Living Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas" aria-label="Fifty colorful circles drifting and attracting one another on a dark canvas"></canvas>
  <footer>
    <input id="time" type="range" min="-120" max="120" step="0.1" value="0"
      aria-label="Life-cycle time offset" aria-valuetext="Present" title="Scrub life cycles backward or forward">
    <div class="controls" role="group" aria-label="Simulation controls">
      <button id="pause" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="pause-icon" d="M7 5v10M13 5v10"/></svg><span>Pause</span></button>
      <button id="reset" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 .4 5M4 4v4h4"/></svg><span>Reset</span></button>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
